<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klocki — prosta gra</title>
  <style>
    :root { color-scheme: dark; --bg:#101522; --panel:#1a2335; --text:#f4f7ff; --muted:#aab5ca; --accent:#7c9cff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:var(--text); background:radial-gradient(circle at top,#24324d,var(--bg) 65%); }
    .game { width:min(100%,620px); display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:18px; align-items:start; }
    header { grid-column:1/-1; text-align:center; }
    h1 { margin:0 0 5px; font-size:clamp(2rem,6vw,3rem); letter-spacing:.04em; }
    header p { margin:0; color:var(--muted); }
    .board-wrap,.side { background:var(--panel); border:1px solid #34415a; border-radius:16px; padding:14px; box-shadow:0 18px 45px #0005; }
    canvas { display:block; width:100%; height:auto; background:#0b1020; border:1px solid #39445e; border-radius:8px; }
    .stats { display:grid; gap:12px; }
    .stat { padding:11px; background:#111a2a; border-radius:10px; }
    .stat span { display:block; color:var(--muted); font-size:.8rem; }
    .stat strong { font-size:1.45rem; font-variant-numeric:tabular-nums; }
    #next { width:100%; max-width:120px; margin:auto; }
    button { width:100%; border:0; border-radius:10px; padding:11px 12px; background:var(--accent); color:#101522; font-weight:750; cursor:pointer; font-size:.95rem; }
    button.secondary { margin-top:8px; background:#34415a; color:var(--text); }
    button:hover { filter:brightness(1.1); }
    .help { color:var(--muted); font-size:.83rem; line-height:1.6; }
    .mobile-controls { display:none; grid-column:1/-1; grid-template-columns:repeat(4,1fr); gap:8px; }
    .mobile-controls button { padding:14px 4px; font-size:1.1rem; }
    @media(max-width:520px) { .game { grid-template-columns:minmax(0,1fr) 115px; gap:10px; } .board-wrap,.side { padding:9px; } .side { font-size:.85rem; } .stat { padding:8px; } .stat strong { font-size:1.15rem; } .mobile-controls { display:grid; } }
  </style>
</head>
<body>
  <main class="game">
    <header><h1>KLOCKI</h1><p>Układaj klocki i czyść pełne rzędy!</p></header>
    <section class="board-wrap" aria-label="Plansza gry"><canvas id="board" width="300" height="600"></canvas></section>
    <aside class="side">
      <div class="stats">
        <div class="stat"><span>PUNKTY</span><strong id="score">0</strong></div>
        <div class="stat"><span>POZIOM</span><strong id="level">1</strong></div>
        <div class="stat"><span>RZĘDY</span><strong id="lines">0</strong></div>
        <div><span class="help">Następny klocek</span><canvas id="next" width="120" height="100"></canvas></div>
        <button id="start">Nowa gra</button>
        <button id="pause" class="secondary">Pauza</button>
        <p class="help"><b>Sterowanie</b><br>← → ruch<br>↓ szybciej<br>↑ obrót<br>Spacja — zrzut<br>P — pauza</p>
      </div>
    </aside>
    <div class="mobile-controls">
      <button data-action="left" aria-label="W lewo">←</button>
      <button data-action="rotate" aria-label="Obróć">↻</button>
      <button data-action="right" aria-label="W prawo">→</button>
      <button data-action="down" aria-label="W dół">↓</button>
    </div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next'), nctx = nextCanvas.getContext('2d');
  const COLS = 10, ROWS = 20, SIZE = 30;
  const colors = [null, '#39c6d8', '#4f78ff', '#ff9f43', '#f4d35e', '#62d98b', '#b57aff', '#f06b91'];
  const shapes = [
    [[1,1,1,1]], [[2,0,0],[2,2,2]], [[0,0,3],[3,3,3]],
    [[4,4],[4,4]], [[0,5,5],[5,5,0]], [[0,6,0],[6,6,6]], [[7,7,0],[0,7,7]]
  ];
  let grid, piece, nextPiece, score, lines, level, dropCounter, lastTime, running, paused, ended, animation;
  const $ = id => document.getElementById(id);
  const clone = m => m.map(row => row.slice());
  function randomPiece() { return clone(shapes[Math.floor(Math.random()*shapes.length)]); }
  function reset() {
    grid = Array.from({length:ROWS}, () => Array(COLS).fill(0));
    score = 0; lines = 0; level = 1; dropCounter = 0; lastTime = 0;
    piece = { matrix: randomPiece(), x:3, y:0 }; nextPiece = randomPiece();
    running = true; paused = false; ended = false;
    $('pause').textContent = 'Pauza'; updateStats(); drawNext();
    cancelAnimationFrame(animation); animation = requestAnimationFrame(loop);
  }
  function collide(matrix=piece.matrix, ox=piece.x, oy=piece.y) {
    for (let y=0;y<matrix.length;y++) for (let x=0;x<matrix[y].length;x++) {
      if (!matrix[y][x]) continue;
      const px=x+ox, py=y+oy;
      if (px<0 || px>=COLS || py>=ROWS || (py>=0 && grid[py][px])) return true;
    }
    return false;
  }
  function merge() {
    piece.matrix.forEach((row,y) => row.forEach((v,x) => { if (v && y+piece.y>=0) grid[y+piece.y][x+piece.x]=v; }));
    let cleared=0;
    for (let y=ROWS-1;y>=0;y--) {
      if (grid[y].every(Boolean)) { grid.splice(y,1); grid.unshift(Array(COLS).fill(0)); cleared++; y++; }
    }
    if (cleared) { lines+=cleared; score += [0,100,300,500,800][cleared] * level; level=1+Math.floor(lines/10); }
    piece = {matrix:nextPiece,x:3,y:0}; nextPiece=randomPiece(); drawNext(); updateStats();
    if (collide()) { ended=true; running=false; overlay('Koniec gry!'); }
  }
  function move(dx) { if (!running || paused || ended) return; if (!collide(piece.matrix,piece.x+dx,piece.y)) piece.x+=dx; }
  function down() {
    if (!running || paused || ended) return;
    if (!collide(piece.matrix,piece.x,piece.y+1)) { piece.y++; score++; }
    else merge();
    dropCounter=0; updateStats();
  }
  function hardDrop() {
    if (!running || paused || ended) return;
    let distance=0; while (!collide(piece.matrix,piece.x,piece.y+1)) { piece.y++; distance++; }
    score += distance*2; merge(); updateStats();
  }
  function rotate() {
    if (!running || paused || ended) return;
    const m=piece.matrix, rotated=m[0].map((_,i)=>m.map(row=>row[i]).reverse());
    for (const offset of [0,-1,1,-2,2]) if (!collide(rotated,piece.x+offset,piece.y)) { piece.matrix=rotated; piece.x+=offset; return; }
  }
  function drawCell(context,x,y,color,size) {
    context.fillStyle=color; context.fillRect(x*size+1,y*size+1,size-2,size-2);
    context.fillStyle='#ffffff24'; context.fillRect(x*size+3,y*size+3,size-6,3);
  }
  function draw() {
    ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,canvas.width,canvas.height);
    grid.forEach((row,y)=>row.forEach((v,x)=>{ if(v) drawCell(ctx,x,y,colors[v],SIZE); }));
    if (piece) piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{ if(v) drawCell(ctx,x+piece.x,y+piece.y,colors[v],SIZE); }));
    ctx.strokeStyle='#ffffff12'; for(let x=1;x<COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE,0);ctx.lineTo(x*SIZE,canvas.height);ctx.stroke();}
    for(let y=1;y<ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE);ctx.lineTo(canvas.width,y*SIZE);ctx.stroke();}
    if (paused) overlay('Pauza');
  }
  function overlay(message) {
    ctx.fillStyle='#080d18bb'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 25px system-ui'; ctx.fillText(message,150,285);
    if (ended) { ctx.font='14px system-ui'; ctx.fillText('Kliknij „Nowa gra”, aby spróbować ponownie',150,315); }
  }
  function drawNext() {
    nctx.fillStyle='#0b1020'; nctx.fillRect(0,0,120,100);
    const w=nextPiece[0].length, h=nextPiece.length, s=22, ox=(120-w*s)/2, oy=(100-h*s)/2;
    nextPiece.forEach((row,y)=>row.forEach((v,x)=>{if(v){nctx.fillStyle=colors[v];nctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2);}}));
  }
  function updateStats() { $('score').textContent=score; $('level').textContent=level; $('lines').textContent=lines; }
  function loop(time=0) {
    const delta=time-lastTime; lastTime=time;
    if (running && !paused && !ended) { dropCounter+=delta; if(dropCounter>Math.max(100,800-(level-1)*65)) down(); }
    draw(); animation=requestAnimationFrame(loop);
  }
  function togglePause() {
    if (!running || ended) return;
    paused=!paused; $('pause').textContent=paused?'Wznów':'Pauza'; draw();
  }
  document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
    if(e.key==='ArrowLeft') move(-1); else if(e.key==='ArrowRight') move(1);
    else if(e.key==='ArrowDown') down(); else if(e.key==='ArrowUp') rotate();
    else if(e.code==='Space') hardDrop(); else if(e.key.toLowerCase()==='p') togglePause();
  });
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const a=btn.dataset.action; if(a==='left')move(-1); if(a==='right')move(1); if(a==='down')down(); if(a==='rotate')rotate();
  }));
  $('start').addEventListener('click',reset); $('pause').addEventListener('click',togglePause);
  reset();
})();
</script>
</body>
</html>
